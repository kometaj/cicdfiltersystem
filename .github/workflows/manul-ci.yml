
name: CI - CI/CD Filter System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose what to execute"
        type: choice
        required: true
        default: all
        options:
          - all
          - lint
          - test
          - filter-demo

      config_file:
        description: "Path to filter YAML configuration"
        type: string
        required: true
        default: filters.yaml

      changed_files:
        description: "Comma-separated paths for the filter demo"
        type: string
        required: false
        default: "README.md,app/src/main.kt,web/app.tsx"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_mode == 'all' ||
      inputs.run_mode == 'lint'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_mode == 'all' ||
      inputs.run_mode == 'test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  filter-demo:
    name: Filter demonstration
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.run_mode == 'all' || inputs.run_mode == 'filter-demo')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Evaluate changed paths
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          args=()
          IFS=',' read -ra paths <<< "$CHANGED_FILES"
          for path in "${paths[@]}"; do
            args+=("$path")
          done

          python -m ci_filter \
            --config "$CONFIG_FILE" \
            "${args[@]}"
