[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-cd-filter-system"
version = "1.0.0"
description = "Evaluate changed file paths against YAML-defined CI/CD filters."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ci-filter = "ci_filter.cli:main"

[tool.setuptools.packages.find]
include = ["ci_filter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
